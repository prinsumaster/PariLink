version: '3.8'

networks:
  parilink_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:



services:
  postgres:
    image: postgres:15-alpine
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: parilink
      POSTGRES_DB: parilink_db
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE_ME_IN_PRODUCTION}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - parilink_net
    #secrets:
      #- db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parilink -d parilink_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - parilink_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:-CHANGE_ME_IN_PRODUCTION}"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - parilink_net
    #secrets:
      #- db_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://parilink:${POSTGRES_PASSWORD}@postgres:5432/parilink_db?schema=public
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required and must not be empty}
      - APP_URL=http://api:8080
      - PORT=8080
    networks:
      - parilink_net
    #secrets:
    #  - jwt_secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:8080/api/v1
    networks:
      - parilink_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
