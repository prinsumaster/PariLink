tempo:
  retention: 240h
  storage:
    trace:
      backend: s3
      s3:
        bucket: parilink-logs-production
        endpoint: s3.ap-south-1.amazonaws.com

server:
  http_listen_port: 3100

distributor:
  nodeSelector:
    role: system
compactor:
  nodeSelector:
    role: system
querier:
  nodeSelector:
    role: system
ingester:
  nodeSelector:
    role: system
