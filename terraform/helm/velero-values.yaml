configuration:
  provider: aws
  backupStorageLocation:
    name: default
    bucket: parilink-backups-production
    config:
      region: ap-south-1
  volumeSnapshotLocation:
    name: default
    config:
      region: ap-south-1

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.9.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

nodeSelector:
  role: system

schedules:
  daily-backup:
    schedule: "0 2 * * *"
    template:
      includedNamespaces:
        - default
      snapshotVolumes: true
      ttl: 720h
