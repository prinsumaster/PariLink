# =============================================================================
# PariLink Kubernetes — HPA, VPA, PDB (All workloads)
# =============================================================================

# ─── HPA: API ────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parilink-api-hpa
  namespace: parilink-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parilink-api
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    # Custom metric: HTTP request queue depth
    - type: Pods
      pods:
        metric:
          name: http_requests_pending
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # 5 min cooldown before scale-down
      policies:
        - type:          Pods
          value:         2
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type:          Pods
          value:         4
          periodSeconds: 30
        - type:          Percent
          value:         50
          periodSeconds: 30
      selectPolicy: Max

---
# ─── HPA: Web ─────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parilink-web-hpa
  namespace: parilink-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parilink-web
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods; value: 1; periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent; value: 100; periodSeconds: 30

---
# ─── VPA: API ─────────────────────────────────────────────────────────────────
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: parilink-api-vpa
  namespace: parilink-prod
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parilink-api
  updatePolicy:
    updateMode: "Auto"     # Auto-update pods; use "Off" to only recommend
  resourcePolicy:
    containerPolicies:
      - containerName: api
        minAllowed:
          cpu:    "200m"
          memory: "512Mi"
        maxAllowed:
          cpu:    "4"
          memory: "8Gi"
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsAndLimits

---
# ─── PDB: API ─────────────────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: parilink-api-pdb
  namespace: parilink-prod
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: api

---
# ─── PDB: Web ─────────────────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: parilink-web-pdb
  namespace: parilink-prod
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: web

---
# ─── PriorityClass ────────────────────────────────────────────────────────────
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 1000000
globalDefault: false
description: "PariLink production workloads — high priority"

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: medium-priority
value: 500000
globalDefault: true
description: "PariLink non-critical workloads — medium priority"
