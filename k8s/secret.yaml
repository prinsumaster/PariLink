# =============================================================================
# PariLink Kubernetes — Template Secrets
# DO NOT COMMIT REAL SECRETS TO VERSION CONTROL.
#
# This file is a template only. All <REPLACE_WITH_*> values must be replaced
# with real secrets before applying to any cluster.
#
# In production, use ExternalSecrets Operator to pull from AWS Secrets Manager
# or HashiCorp Vault instead of managing secrets here directly.
#
# Apply with: kubectl apply -f k8s/secret.yaml
# (after filling in all placeholder values below)
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: parilink-db-secret
  namespace: parilink-prod
type: Opaque
stringData:
  host: "postgres-service"
  url: "postgresql://parilink:<REPLACE_WITH_POSTGRES_PASSWORD>@postgres-service:5432/parilink_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: parilink-redis-secret
  namespace: parilink-prod
type: Opaque
stringData:
  url: "redis://:<REPLACE_WITH_REDIS_PASSWORD>@redis-service:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: parilink-app-secret
  namespace: parilink-prod
type: Opaque
stringData:
  jwt-secret: "<REPLACE_WITH_JWT_SECRET>"
  jwt-refresh-secret: "<REPLACE_WITH_JWT_REFRESH_SECRET>"
  master-encryption-key-v1: "<REPLACE_WITH_MASTER_ENCRYPTION_KEY_V1>"
---
apiVersion: v1
kind: Secret
metadata:
  name: parilink-aws-secret
  namespace: parilink-prod
type: Opaque
stringData:
  s3-bucket: "parilink-prod-documents"
