name: "PariLink Enterprise CD — Deploy to Production"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      strategy:
        description: "Deployment strategy"
        required: true
        type: choice
        options: [rolling, blue-green, canary]
        default: rolling
      canary_weight:
        description: "Canary traffic % (only for canary strategy)"
        required: false
        default: "20"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a production deployment

env:
  REGISTRY: ghcr.io
  CLUSTER_NAME: parilink-production
  AWS_REGION: ap-south-1
  K8S_NAMESPACE: parilink-prod

permissions:
  id-token: write    # OIDC for AWS auth
  contents: read
  packages: read

jobs:
  # ─── Pre-Deploy: Extract version and validate ──────────────────────────────
  prepare:
    name: "Prepare Release"
    runs-on: ubuntu-latest
    outputs:
      version:     ${{ steps.version.outputs.version }}
      environment: ${{ steps.env.outputs.environment }}
      strategy:    ${{ steps.env.outputs.strategy }}
      image_tag:   ${{ steps.version.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="sha-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "🚀 Deploying version: ${VERSION}"

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "strategy=${{ inputs.strategy }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" =~ -rc\. ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "strategy=rolling" >> $GITHUB_OUTPUT
          else
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "strategy=rolling" >> $GITHUB_OUTPUT
          fi

  # ─── Database Migration ────────────────────────────────────────────────────
  migrate:
    name: "Database Migration"
    runs-on: ubuntu-latest
    needs: prepare
    environment: ${{ needs.prepare.outputs.environment }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/parilink-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Get DB credentials from Secrets Manager
        id: db
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "parilink/${{ needs.prepare.outputs.environment }}/database" \
            --query SecretString --output text)
          echo "url=$(echo $SECRET | jq -r .url)" >> $GITHUB_OUTPUT

      - name: Run Prisma Migrations (schema-level, non-destructive)
        run: |
          cd apps/api
          npx prisma migrate deploy --schema=./prisma/schema.prisma
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}

      - name: Verify migration health
        run: |
          cd apps/api
          npx prisma db execute --stdin <<< "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';"
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}

  # ─── Deploy to Kubernetes ──────────────────────────────────────────────────
  deploy:
    name: "Deploy — ${{ needs.prepare.outputs.strategy }}"
    runs-on: ubuntu-latest
    needs: [prepare, migrate]
    environment: ${{ needs.prepare.outputs.environment }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/parilink-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Rolling Deployment
        if: needs.prepare.outputs.strategy == 'rolling'
        run: |
          IMAGE_TAG="${{ needs.prepare.outputs.image_tag }}"
          REGISTRY="${{ env.REGISTRY }}/${{ github.repository }}"

          echo "📦 Deploying image tag: ${IMAGE_TAG}"

          # Update API deployment
          kubectl set image deployment/parilink-api \
            api="${REGISTRY}/parilink-api:${IMAGE_TAG}" \
            -n ${{ env.K8S_NAMESPACE }}

          # Update Web deployment
          kubectl set image deployment/parilink-web \
            web="${REGISTRY}/parilink-web:${IMAGE_TAG}" \
            -n ${{ env.K8S_NAMESPACE }}

          # Wait for rollout
          kubectl rollout status deployment/parilink-api \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s

          kubectl rollout status deployment/parilink-web \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s

      - name: Blue-Green Deployment
        if: needs.prepare.outputs.strategy == 'blue-green'
        run: |
          IMAGE_TAG="${{ needs.prepare.outputs.image_tag }}"
          REGISTRY="${{ env.REGISTRY }}/${{ github.repository }}"
          TIMESTAMP=$(date +%s)

          echo "🔵🟢 Blue-Green deploying: ${IMAGE_TAG}"

          # Deploy green (new) version
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: parilink-api-green-${TIMESTAMP}
            namespace: ${{ env.K8S_NAMESPACE }}
            labels:
              app: api
              slot: green
              version: "${IMAGE_TAG}"
          spec:
            replicas: 3
            selector:
              matchLabels:
                app: api-green-${TIMESTAMP}
            template:
              metadata:
                labels:
                  app: api-green-${TIMESTAMP}
                  slot: green
              spec:
                containers:
                  - name: api
                    image: ${REGISTRY}/parilink-api:${IMAGE_TAG}
          EOF

          # Wait for green to be ready
          kubectl rollout status deployment/parilink-api-green-${TIMESTAMP} \
            -n ${{ env.K8S_NAMESPACE }} --timeout=300s

          # Smoke test green
          GREEN_POD=$(kubectl get pod -n ${{ env.K8S_NAMESPACE }} \
            -l app=api-green-${TIMESTAMP} \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n ${{ env.K8S_NAMESPACE }} ${GREEN_POD} -- \
            wget -qO- http://localhost:8080/api/v1/health | grep '"status":"ok"'

          # Switch service traffic to green
          kubectl patch service parilink-api \
            -n ${{ env.K8S_NAMESPACE }} \
            -p '{"spec":{"selector":{"app":"api-green-'${TIMESTAMP}'"}}}'

          echo "✅ Traffic switched to green. Blue deployment can be removed after validation."

      - name: Canary Deployment
        if: needs.prepare.outputs.strategy == 'canary'
        run: |
          IMAGE_TAG="${{ needs.prepare.outputs.image_tag }}"
          REGISTRY="${{ env.REGISTRY }}/${{ github.repository }}"
          WEIGHT="${{ inputs.canary_weight || '20' }}"

          echo "🐤 Canary deploying ${WEIGHT}% traffic: ${IMAGE_TAG}"

          # Deploy canary version with single replica
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: parilink-api-canary
            namespace: ${{ env.K8S_NAMESPACE }}
            labels:
              app: api
              track: canary
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: api
                track: canary
            template:
              metadata:
                labels:
                  app: api
                  track: canary
                annotations:
                  prometheus.io/scrape: "true"
              spec:
                containers:
                  - name: api
                    image: ${REGISTRY}/parilink-api:${IMAGE_TAG}
          EOF

          # Apply Nginx canary ingress annotations
          kubectl annotate ingress parilink-api-ingress \
            -n ${{ env.K8S_NAMESPACE }} \
            nginx.ingress.kubernetes.io/canary="true" \
            nginx.ingress.kubernetes.io/canary-weight="${WEIGHT}" \
            --overwrite

          echo "✅ Canary deployed. Monitor errors at Grafana before promoting."

  # ─── Smoke Tests ──────────────────────────────────────────────────────────
  smoke-test:
    name: "Smoke Tests"
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: API Health Check
        run: |
          ENV="${{ needs.prepare.outputs.environment }}"
          if [[ "$ENV" == "production" ]]; then
            BASE_URL="https://api.parilink.app"
          else
            BASE_URL="https://api-staging.parilink.app"
          fi

          echo "🔍 Smoke testing: ${BASE_URL}"

          # Health check
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${BASE_URL}/api/v1/health")
          if [[ "$STATUS" != "200" ]]; then
            echo "❌ Health check failed with status: ${STATUS}"
            exit 1
          fi

          # Database connectivity
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${BASE_URL}/api/v1/health/ready")
          if [[ "$STATUS" != "200" ]]; then
            echo "❌ Readiness check failed with status: ${STATUS}"
            exit 1
          fi

          echo "✅ Smoke tests passed"

  # ─── Rollback (on failure) ─────────────────────────────────────────────────
  rollback:
    name: "Auto Rollback"
    runs-on: ubuntu-latest
    needs: [prepare, deploy, smoke-test]
    if: failure()

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/parilink-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Rollback deployments
        run: |
          echo "⚠️ Deployment failed — initiating rollback"
          kubectl rollout undo deployment/parilink-api -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout undo deployment/parilink-web -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/parilink-api -n ${{ env.K8S_NAMESPACE }} --timeout=120s
          echo "✅ Rollback complete"

      - name: Notify on failure
        uses: slackapi/slack-github-action@v1.26.0
        if: always()
        with:
          payload: |
            {
              "text": "❌ PariLink deployment FAILED and rolled back\nVersion: ${{ needs.prepare.outputs.version }}\nEnvironment: ${{ needs.prepare.outputs.environment }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ─── Post-Deploy Notification ──────────────────────────────────────────────
  notify:
    name: "Notify Deployment Success"
    runs-on: ubuntu-latest
    needs: [prepare, deploy, smoke-test]
    if: success()

    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ PariLink ${{ needs.prepare.outputs.version }} deployed to ${{ needs.prepare.outputs.environment }}\nStrategy: ${{ needs.prepare.outputs.strategy }}\nBy: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
