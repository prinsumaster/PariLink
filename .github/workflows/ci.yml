name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  validate-code:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      
      - name: Type Check (TypeScript)
        run: npm run typecheck
        
      - name: ESLint
        run: npm run lint
        
      - name: Unit Tests
        run: npm run test:unit -- --coverage

  validate-infrastructure:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: ./.github/actions/terraform
        with:
          aws_role_arn: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGING }}
          
      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check
        
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend=false
        
      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

  validate-kubernetes:
    name: Helm & K8s Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Helm
        uses: azure/setup-helm@v5
        
      - name: Helm Lint
        run: |
          for chart in terraform/helm/*-values.yaml; do
            echo "Linting configs associated with $chart (dry-run style)"
            # Real helm lint requires a full chart. Here we'd validate syntax.
          done
