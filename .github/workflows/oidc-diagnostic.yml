name: OIDC Diagnostic (Safe - No Secrets Exposed)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose-oidc:
    name: Diagnose OIDC Claims
    runs-on: ubuntu-latest

    steps:
      - name: Request OIDC Token and Decode Claims (Safe)
        run: |
          # Request OIDC token from GitHub's OIDC provider
          RESPONSE=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          
          # Extract only the payload (middle part of JWT) - NOT the full token
          echo "$RESPONSE" | python3 -c "
          import sys, json, base64
          data = sys.stdin.read().strip()
          try:
              jwt_data = json.loads(data)
              token = jwt_data.get('value', '')
          except:
              token = data
          parts = token.split('.')
          if len(parts) >= 2:
              payload_b64 = parts[1]
              padding = 4 - len(payload_b64) % 4
              if padding != 4:
                  payload_b64 += '=' * padding
              payload = base64.urlsafe_b64decode(payload_b64)
              claims = json.loads(payload)
              safe_claims = {
                  'iss': claims.get('iss'),
                  'aud': claims.get('aud'),
                  'sub': claims.get('sub'),
                  'repository': claims.get('repository'),
                  'repository_owner': claims.get('repository_owner'),
                  'ref': claims.get('ref'),
                  'environment': claims.get('environment'),
                  'workflow': claims.get('workflow'),
                  'job_workflow_ref': claims.get('job_workflow_ref'),
                  'event_name': claims.get('event_name'),
              }
              print('=== OIDC CLAIMS (no token exposed) ===')
              print(json.dumps(safe_claims, indent=2))
              print()
              print('=== CRITICAL: sub claim for IAM StringLike ===')
              print('sub:', claims.get('sub'))
          else:
              print('ERROR: Could not parse JWT')
          "

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::121546003161:role/parilink-github-actions-deploy-production
          aws-region: ap-south-1

      - name: Verify AWS Identity and Inspect Live Role
        run: |
          echo "=== AWS Identity After OIDC ==="
          aws sts get-caller-identity
          echo ""
          echo "=== Live IAM Role Trust Policy ==="
          aws iam get-role --role-name parilink-github-actions-deploy-production \
            --query 'Role.AssumeRolePolicyDocument' --output json
          echo ""
          echo "=== OIDC Provider Config ==="
          PROVIDER_ARN=$(aws iam list-open-id-connect-providers \
            --query "OpenIDConnectProviderList[?contains(Arn, 'token.actions')].Arn" \
            --output text)
          echo "Provider ARN: $PROVIDER_ARN"
          if [ -n "$PROVIDER_ARN" ]; then
            aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$PROVIDER_ARN" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({'Url':d.get('Url'),'ClientIDList':d.get('ClientIDList'),'ThumbprintList':d.get('ThumbprintList')}, indent=2))"
          fi
