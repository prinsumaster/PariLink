apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Chart.Name }}
type: Opaque
data:
  DATABASE_URL: {{ default "postgresql://user:pass@parilink-postgres:5432/parilink" .Values.database.url | b64enc | quote }}
  REDIS_URL: {{ default "redis://parilink-redis:6379" .Values.redis.url | b64enc | quote }}
  JWT_SECRET: {{ default "fallback-secret-key" .Values.secrets.jwt | b64enc | quote }}
  COOKIE_SECRET: {{ "fallback-cookie-secret" | b64enc | quote }}
