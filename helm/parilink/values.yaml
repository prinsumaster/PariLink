global:
  environment: production
  tenant: default
replicaCount:
  api: 3
  web: 3
image:
  repository: parilink
  tag: "latest"
  pullPolicy: IfNotPresent
api:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  hpa:
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
web:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  hpa:
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
postgresql-ha:
  enabled: true
  postgresql:
    replicaCount: 3
    password: "parilink-secure-db"
    repmgrPassword: "parilink-repmgr"
  pgpool:
    replicaCount: 2
    adminPassword: "parilink-admin"
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 8Gi

redis:
  enabled: true
  architecture: replication
  auth:
    password: "parilink-secure-redis"
  replica:
    replicaCount: 3
  sentinel:
    enabled: true
    masterSet: parilink-master
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

observability:
  enabled: true
  kube-prometheus-stack:
    grafana:
      adminPassword: "parilink-grafana"
      ingress:
        enabled: true
        ingressClassName: nginx
        hosts:
          - grafana.parilink.com
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.parilink.com
    prometheus:
      prometheusSpec:
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: api.parilink.com
      paths:
        - path: /
          pathType: Prefix
          service: api
    - host: app.parilink.com
      paths:
        - path: /
          pathType: Prefix
          service: web
  tls:
    - secretName: parilink-tls
      hosts:
        - api.parilink.com
        - app.parilink.com
