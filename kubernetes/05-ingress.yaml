apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parilink-ingress
  namespace: parilink-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  tls:
    - hosts:
        - app.parilink.com
        - api.parilink.com
      secretName: parilink-tls-secret
  rules:
    - host: app.parilink.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: parilink-web
                port:
                  number: 80
    - host: api.parilink.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: parilink-api
                port:
                  number: 80
