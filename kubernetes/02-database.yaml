apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: parilink-production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parilink-postgres
  namespace: parilink-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parilink-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: parilink-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "parilink"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: parilink-postgres
  namespace: parilink-production
spec:
  ports:
    - port: 5432
  selector:
    app: parilink-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parilink-redis
  namespace: parilink-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parilink-redis
  template:
    metadata:
      labels:
        app: parilink-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: parilink-redis
  namespace: parilink-production
spec:
  ports:
    - port: 6379
  selector:
    app: parilink-redis
