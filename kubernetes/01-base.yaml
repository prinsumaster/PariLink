apiVersion: v1
kind: Namespace
metadata:
  name: parilink-production
  labels:
    environment: production
    app: parilink
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: parilink-config
  namespace: parilink-production
data:
  NODE_ENV: "production"
  API_URL: "https://api.parilink.app/api/v1"
  WEB_URL: "https://parilink.app"
  CORS_ALLOWED_ORIGINS: "https://parilink.app,https://api.parilink.app"
  COOKIE_DOMAIN: ".parilink.app"
  REDIS_HOST: "parilink-redis"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: parilink-secrets-template
  namespace: parilink-production
type: Opaque
stringData:
  # NOTE: Replace with external secrets manager in production (e.g. AWS Secrets Manager, HashiCorp Vault)
  DATABASE_URL: "postgresql://postgres:postgres@parilink-postgres:5432/parilink?schema=public&connection_limit=50"
  JWT_SECRET: "replace-this-with-a-secure-random-secret"
  JWT_EXPIRES_IN: "1h"
  JWT_REFRESH_SECRET: "replace-this-with-a-secure-random-refresh-secret"
  JWT_REFRESH_EXPIRES_IN: "7d"
