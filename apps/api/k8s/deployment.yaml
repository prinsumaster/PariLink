apiVersion: apps/v1
kind: Deployment
metadata:
  name: parilink-api
  namespace: default
  labels:
    app: parilink-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: parilink-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: parilink-api
    spec:
      containers:
      - name: parilink-api
        image: parilink-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: parilink-api-secrets
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/v1/platform/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/platform/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
